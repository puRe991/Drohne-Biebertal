name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typprüfung, Tests und Deploy-Probelauf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Baut den Worker wie beim echten Deploy, ohne Cloudflare-Zugangsdaten.
      # Schlägt fehl, wenn wrangler.toml oder ein Import kaputt ist.
      - name: Deploy-Probelauf
        run: npx wrangler deploy --dry-run --outdir dist
