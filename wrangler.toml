# Ziel für lokale Deploys (`npm run deploy`). Cloudflare Workers Builds ignoriert
# diesen Wert und deployt auf den verbundenen Worker - eine Abweichung erzeugt dort
# nur eine Warnung, keinen Fehler.
name = "drohne-biebertal"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Statische Dateien aus public/ (styles.css, robots.txt). Cloudflare liefert sie
# direkt aus; alle übrigen Pfade beantwortet der Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

[vars]
APP_ENV = "production"
APP_DEBUG = "false"
PAGE_CACHE_SECONDS = "60"
SESSION_LIFETIME = "7200"
ADMIN_EMAIL = "admin@feuerwehr-biebertal.local"

# Speicher für die redaktionellen Inhalte. Ein Durable Object wird beim Deploy
# automatisch mit angelegt - es muss keine Datenbank erstellt und keine ID
# eingetragen werden.
[[durable_objects.bindings]]
name = "CONTENT"
class_name = "ContentStore"

[[migrations]]
tag = "v1"
# SQLite-gestützte Durable Objects sind auch im kostenlosen Workers-Tarif nutzbar.
new_sqlite_classes = ["ContentStore"]

# Secrets werden NICHT hier abgelegt, sondern gesetzt mit:
#   npx wrangler secret put ADMIN_PASSWORD_HASH
#   npx wrangler secret put APP_SECRET
